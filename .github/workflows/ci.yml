name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ── 1. Server Tests ───────────────────────────────────────
  test:
    name: Server Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Run tests
        working-directory: server
        env:
          JWT_SECRET: test-jwt-secret-at-least-32-chars-long
          JWT_EXPIRES_IN: 1d
          NODE_ENV: test
        run: npm test

  # ── 2. Client Build ───────────────────────────────────────
  build-client:
    name: Client Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm install --legacy-peer-deps

      - name: Build client
        working-directory: client
        env:
          CI: false
          REACT_APP_API_URL: http://localhost:4000
        run: npm run build

  # ── 3. Deploy (main branch only) ─────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test, build-client]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy backend to Render
        run: |
          echo "Triggering Render backend deploy..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}')
          if [ "$STATUS" -eq 201 ] || [ "$STATUS" -eq 202 ]; then
            echo "✅ Backend deploy triggered on Render (HTTP $STATUS)"
          else
            echo "❌ Render API returned HTTP $STATUS"
            exit 1
          fi

      - name: Verify Vercel frontend deployment
        run: |
          echo "Vercel is connected to GitHub and auto-deploys on push to main."
          echo "Checking latest deployment status..."
          RESPONSE=$(curl -s \
            "https://api.vercel.com/v6/deployments?projectId=${{ secrets.VERCEL_PROJECT_ID }}&limit=1&target=production" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}")
          STATE=$(echo $RESPONSE | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['deployments'][0].get('readyState','unknown'))" 2>/dev/null || echo "deploying")
          URL=$(echo $RESPONSE | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['deployments'][0].get('url',''))" 2>/dev/null || echo "")
          echo "✅ Vercel deployment state: $STATE"
          echo "🌐 URL: https://$URL"
